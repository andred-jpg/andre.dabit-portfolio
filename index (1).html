<style>
:root{color-scheme:dark;--bg:#17191d;--panel:#23262c;--line:#464b54;--white:#fff;--muted:#c8cdd6;--accent:#36a7ff;--blue:#0068cf;--ink:#20232a;--soft-blue:#eaf4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#242a34 0,transparent 440px),var(--bg);color:var(--white);font:16px/1.6 system-ui,sans-serif}a{color:inherit}button,a{touch-action:manipulation}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{font:inherit;color:inherit}header,main,footer{max-width:1000px;margin:auto;padding-inline:clamp(18px,5vw,52px)}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px}header{min-height:75px;border-bottom:1px solid var(--line)}header a,footer a{text-decoration:none}header a:hover,footer a:hover{text-decoration:underline}.brand{font-weight:750}.brand{display:inline-flex;align-items:center;gap:8px}.brand-icon{display:block;flex:none;border-radius:6px}.toplink,.subtle{color:var(--muted)}main{min-height:70vh;padding-block:clamp(32px,7vw,80px)}h1,h2,h3,p{margin:0}h1{font-size:clamp(2.5rem,8vw,5.8rem);line-height:1;letter-spacing:-.065em;max-width:760px}h2{font-size:clamp(1.4rem,4vw,2.25rem);letter-spacing:-.035em}.eyebrow{font-size:.72rem;letter-spacing:.17em;text-transform:uppercase;font-weight:750;color:var(--accent);margin-bottom:12px}.lead{color:var(--muted);margin:16px 0 26px;max-width:62ch}.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px}.rail::after{content:"";flex:0 0 max(calc(17% - 16px),calc(100% - 391px),0px)}.rail::-webkit-scrollbar{display:none}.tile{flex:0 0 min(83%,375px);min-height:220px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;text-decoration:none;border:1px solid var(--line);background:linear-gradient(145deg,var(--tone),var(--panel) 78%);border-radius:14px;padding:20px}.tile:hover{border-color:var(--accent)}.tile strong{display:block;font-size:clamp(1.4rem,5vw,2rem);line-height:1.15}.tile small{display:block;color:var(--muted);margin-top:6px}.mark{display:inline-grid;place-items:center;min-width:48px;height:48px;padding-inline:8px;border-radius:10px;border:1px solid #ffffff35;font-weight:750;letter-spacing:.08em}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.controls button,.button{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.dots{display:flex}.dots button{padding:0;min-width:32px;border:0;background:transparent}.dots button::after{content:'';height:8px;width:8px;border-radius:50%;background:#818b99}.dots button[aria-current=true]::after{background:var(--accent);width:16px;border-radius:8px}.back{display:inline-block;margin-bottom:18px;color:var(--muted)}.card{max-width:700px;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,6vw,46px);background:linear-gradient(145deg,var(--tone),var(--panel) 60%)}.card .mark{margin-bottom:18px}.card h1,.about h1{font-size:clamp(2.4rem,7vw,4.5rem)}.role{color:var(--accent);font-weight:650;margin-top:10px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}.primary{background:var(--blue);border-color:var(--accent);font-weight:700}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:24px 0}.facts div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(13px,3vw,24px)}.facts strong{display:block;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.1;color:var(--accent)}.facts span{color:var(--muted)}footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:.86rem}@media(min-width:720px){.facts{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* White badge faces contrast with the charcoal site shell. */
.brand{line-height:1.25}.toplink{white-space:nowrap}
.rail{gap:16px;padding:5px 5px 13px;scroll-padding-left:5px}
.rail::after{flex-basis:max(calc(17% - 26px),calc(100% - 401px),0px)}
.tile,.card,.about-intro{color:var(--ink);background:#fff;border:1px solid #dae0e8;box-shadow:0 12px 24px #0005;color-scheme:light}
.tile,.card{overflow:hidden;position:relative}
.tile{flex-basis:min(83%,375px);min-height:408px;justify-content:flex-start;gap:16px;padding:0 0 16px}
.tile:hover{border-color:var(--accent);background:#fff}
.tile:focus-visible{outline-offset:-3px}
.badge-band{position:relative;display:grid;place-items:center;background:linear-gradient(140deg,var(--tone),#17191d);height:132px;border-bottom:4px solid var(--accent)}
.badge-slot{position:absolute;top:13px;width:32px;height:6px;border-radius:8px;background:#ffffff8a}
.badge-code{position:absolute;top:32px;font-size:.66rem;letter-spacing:.17em;color:#fff;font-weight:750;text-transform:uppercase}
.portrait{display:grid;place-items:center;position:relative;margin:-55px auto 0;width:104px;aspect-ratio:1;flex:none;border:5px solid #fff;border-radius:50%;overflow:hidden;background:#e0efff;color:#0057ab;font-size:2rem;font-weight:750;box-shadow:0 4px 11px #17191d30}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.tile-copy{padding:0 18px;text-align:center}
.tile-name{display:block;color:#0057ab;font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.tile strong{font-size:clamp(1.2rem,4.6vw,1.7rem)}
.tile small,.card .lead,.about-bio{color:#48505c}
.tile-open{margin:auto 18px 0;padding-top:10px;border-top:1px solid #dce3ec;color:#0057ab;font-weight:750;font-size:.9rem;text-align:center}
.card{padding:0;min-height:535px;max-width:540px;margin-inline:auto}
.card .badge-band{height:170px}
.card .portrait{width:138px;margin-top:-72px}
.card-body{padding:20px clamp(20px,5vw,38px) 32px;text-align:center}
.card .eyebrow,.about-intro .eyebrow{color:#0057ab}
.card .role{color:#0057ab}
.card .lead{margin-inline:auto;text-align:left}
.card .actions{justify-content:center}
.card .button:not(.primary){background:var(--soft-blue);color:#004e9d;border-color:#c6ddf5}
.primary{color:#fff}
.about-intro{border-radius:16px;padding:clamp(20px,5vw,40px)}
.about-bio{max-width:70ch;margin-top:16px}
.about-bio p+p{margin-top:14px}
.about-bio strong{color:var(--ink)}
.facts div{background:var(--soft-blue);border-color:#c6ddf5;padding:14px}
.facts strong{color:#0057ab}.facts span{color:#384351}
.contact-list{display:grid;gap:10px;margin:20px 0 0;text-align:left}
.contact-list div{border-top:1px solid #dce3ec;padding-top:9px}
.contact-list dt{font-size:.73rem;text-transform:uppercase;letter-spacing:.09em;font-weight:750;color:#48505c}
.contact-list dd{margin:2px 0 0;overflow-wrap:anywhere}
.contact-list a{color:#0057ab;font-weight:650}
.social-section{margin-top:30px;padding:20px 0 0;border-top:1px solid var(--line)}
.social-section h2{font-size:1.35rem}
.social-icons{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.social-icon{display:inline-grid;place-items:center;width:46px;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--accent)}
.social-icon:hover{border-color:var(--accent);background:#27384b}
.social-icon svg{width:23px;height:23px;fill:currentColor}
/* Each profile sets its colours on both the carousel tile and opened card. */
[data-profile]{--card-accent:var(--accent);--card-ink:#0057ab;--card-action:var(--blue);--card-soft:var(--soft-blue)}
[data-profile="draycon"]{--card-accent:#ff8228;--card-ink:#984000;--card-action:#a74300;--card-soft:#fff2e8}
[data-profile="reancon"]{--card-accent:#ffda33;--card-ink:#594600;--card-action:#262626;--card-soft:#fff8d8}
[data-profile="rean-corporation"]{--card-accent:#fff;--card-ink:#262626;--card-action:#242424;--card-soft:#f1f1f1}
[data-profile] .badge-band{border-color:var(--card-accent)}
[data-profile] .badge-code{color:var(--card-accent)}
.tile[data-profile]:hover,.tile[data-profile]:focus-visible{border-color:var(--card-ink);outline-color:var(--card-ink)}
[data-profile] :is(.tile-name,.tile-open,.eyebrow,.role,.contact-list a,.portrait){color:var(--card-ink)}
[data-profile] .portrait,[data-profile].card .button:not(.primary){background:var(--card-soft)}
[data-profile].card .button:not(.primary){color:var(--card-ink);border-color:#d5d5d5}
[data-profile] .primary{background:var(--card-action);border-color:var(--card-action)}
[data-profile] :is(a,button):focus-visible{outline-color:var(--card-ink)}
[data-profile="personal"] .portrait img{object-position:50% 35%;transform:scale(1.45);transform-origin:50% 35%}
.card .social-section{margin-top:22px;padding-top:16px;border-color:#d5d5d5;text-align:left}
.card .social-icon{color:var(--card-ink);background:var(--card-soft);border-color:#d5d5d5}
.card .social-icon:hover{border-color:var(--card-ink)}
.share-dialog{width:min(440px,calc(100% - 32px));max-height:calc(100% - 32px);border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--white);padding:clamp(16px,5vw,26px)}
.share-dialog::backdrop{background:#000b}
.share-dialog h2{font-size:1.4rem}
.share-dialog p{margin:8px 0 14px;color:var(--muted)}
.share-dialog label{display:block;margin-bottom:5px;font-weight:650}
.share-dialog input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:inherit;font:inherit}
.share-dialog input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.share-dialog canvas{display:block;width:min(100%,240px);height:auto;margin:16px auto 0;background:white;image-rendering:pixelated;border-radius:4px}
.share-dialog [hidden]{display:none}
.share-dialog .actions{margin-top:12px}
.share-dialog button:disabled{opacity:.5;cursor:default}
.share-dialog #share-status{margin-bottom:0;font-size:.9rem}
.share-home{margin-top:18px}
.badge-logo{position:absolute;top:21px;display:grid;place-items:center;width:min(174px,75%);height:48px}
.badge-logo img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.card .badge-logo{top:29px;width:min(208px,75%);height:57px}
.logo-filters{position:absolute;width:0;height:0;pointer-events:none}
[data-profile="reancon"] .badge-logo img{filter:url(#reancon-dark-header)}
.about-volunteering{margin:0 0 24px}
.about-volunteering h2{font-size:1.25rem}
.about-volunteering ul{list-style:none;margin:8px 0 0;padding:0}
.about-volunteering li{border-top:1px solid #dce3ec;padding:8px 0}
.about-volunteering li span{display:block;color:#48505c;font-size:.9rem}
.about-button,.card .about-button:not(.primary){background:var(--blue);color:#fff;border-color:var(--accent);font-weight:700}
.about-button:hover,.card .about-button:not(.primary):hover{background:#005bb6;color:#fff}
.card-back{background:var(--card-accent);color:#17191d;border-color:var(--card-accent);font-weight:700}
.card-back:hover{text-decoration:underline}
.card-back:focus-visible{outline-color:var(--card-accent)}
</style>
</head>

"./QRPolynomial": function(module, require) {
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;

                throw new Error("mode:" + mode);
            }

            throw new Error("type:" + type);
        }

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

		this.setupPositionProbePattern(0, this.moduleCount - 7);

                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);

		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}

	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);

		for (var i = 0; i < 18; i++) {

			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}

		this.modules[this.moduleCount - 8][8] = (!test);

	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {

						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);

						if (mask) {

							bitIndex = 7;
						}

					row -= inc;
					inc = -inc;
					break;
				}
			}
		}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

  link: '<path d="m10 14 4-4m-6 6-1 1a3 3 0 0 1-4-4l4-4a3 3 0 0 1 4 0m2 6a3 3 0 0 0 4 0l4-4a3 3 0 0 0-4-4l-1 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
const page = document.querySelector('#page');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let cleanup = () => {};
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const escapeVCard = value => String(value).replaceAll('\\','\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/[;,]/g,'\\$&');
function socialLinks(profile) {
  return [['LinkedIn', profile.linkedin], ...(profile.socials ?? [])]
    .filter(([, url]) => /^https?:\/\//i.test(url ?? ''));
}
function socialSection(profile, heading) {
  const links = socialLinks(profile);
  if (!links.length) return '';
  const icons = links.map(([label, url]) => {
    const name = escapeHtml(label);
    const key = label.toLowerCase();
    const mark = Object.hasOwn(socialMarks, key) ? socialMarks[key] : socialMarks.link;
    return `<a class="social-icon" href="${escapeHtml(url)}" aria-label="${name}" title="${name}"><svg viewBox="0 0 24 24" aria-hidden="true">${mark}</svg></a>`;
  }).join('');
  return `<section class="social-section" aria-labelledby="social-heading">
    <h2 id="social-heading">${heading}</h2>
    <div class="social-icons">${icons}</div>
  </section>`;
}
function contactDetails(profile) {
  return `<dl class="contact-list">
    <div><dt>Phone</dt><dd><a href="tel:${profile.phone.replace(/[^+0-9]/g, '')}">${escapeHtml(profile.phone)}</a></dd></div>
    <div><dt>Email</dt><dd><a href="mailto:${escapeHtml(profile.email)}">${escapeHtml(profile.email)}</a></dd></div>
  </dl>`;
}
function badgeHeader(profile) {
  const photo = profile.photo;
  const branding = profile.logo
    ? `<span class="badge-logo"><img src="${escapeHtml(profile.logo)}" alt=""></span>`
    : `<span class="badge-slot"></span><span class="badge-code">${escapeHtml(profile.mark)} · Profile</span>`;
  return `<div class="badge-band" aria-hidden="true">${branding}</div>
    <span class="portrait">${photo ? `<img src="${escapeHtml(photo)}" alt="Andre Dabit">` : '<span aria-hidden="true">AD</span>'}</span>`;
}
function foldVCardLine(line) {
  const encoder = new TextEncoder();
  let bytes = 0;
  let result = '';
  for (const char of line) {
    const length = encoder.encode(char).length;
    if (bytes + length > 75) {
      result += '\r\n ';
      bytes = 1;
    }
    result += char;
    bytes += length;
  }
  return result;
}
function contactUri(profile) {
  const fields = [
    ['ORG', profile.org], ['TITLE', profile.title], ['TEL;TYPE=VOICE', profile.phone],
    ['EMAIL;TYPE=INTERNET', profile.email], ['URL', profile.website]
  ].filter(([, value]) => value).map(([key, value]) => key + ':' + escapeVCard(value));
  const socials = socialLinks(profile).flatMap(([label, url], index) => [
    `item${index + 1}.URL:${escapeVCard(url)}`,
    `item${index + 1}.X-ABLabel:${escapeVCard(label)}`
  ]);
  const card = ['BEGIN:VCARD','VERSION:3.0','N:Dabit;Andre;;;','FN:Andre Dabit',...fields,...socials,'END:VCARD','']
    .map(foldVCardLine).join('\r\n');
  return 'data:text/vcard;charset=utf-8,' + encodeURIComponent(card);
}
function home() {
  page.innerHTML = `<div class="eyebrow">Digital business cards</div>
  <h1>How did you meet Andre Dabit?</h1>
  <p class="lead">Choose a profile to view and save the relevant contact details.</p>
  <section aria-label="Choose a profile">
    <div class="rail">${profiles.map(p => `<a class="tile" href="#${p.id}" data-profile="${p.id}" style="--tone:${p.tone}">${badgeHeader(p)}<span class="tile-copy"><span class="tile-name">Andre Dabit</span><strong>${p.label}</strong><small>${p.title ?? 'Personal profile'}</small></span><span class="tile-open">Open profile →</span></a>`).join('')}</div>
    <div class="controls"><button type="button" aria-label="Previous profile">←</button><div class="dots">${profiles.map(p => `<button type="button" aria-label="Show ${p.label}" aria-current="false"></button>`).join('')}</div><button type="button" aria-label="Next profile">→</button></div>
  </section>
  <button class="button primary share-home" type="button" data-share="home">Share portfolio</button>
  ${socialSection(personalProfile, "Andre’s social links")}`;
  const section = page.querySelector('section');
  const rail = section.querySelector('.rail');
  const tiles = Array.from(rail.children);
  const dots = Array.from(section.querySelectorAll('.dots button'));
  let index = 0;
  let timer;
  const update = n => dots.forEach((dot,i) => dot.setAttribute('aria-current',String(i === n)));
  function go(n) {
    index = (n + tiles.length) % tiles.length;
    update(index);
    rail.scrollTo({left:tiles[index].offsetLeft - tiles[0].offsetLeft,behavior:motion.matches?'auto':'smooth'});
  }
  const stop = () => clearInterval(timer);
  const scroll = () => {
    const maximum = rail.scrollWidth - rail.clientWidth;
    if (Math.abs(rail.scrollLeft - maximum) < 3 && maximum > 0) index = tiles.length - 1;
    else index = tiles.reduce((best,tile,i) => Math.abs(tile.offsetLeft - tiles[0].offsetLeft - rail.scrollLeft) < Math.abs(tiles[best].offsetLeft - tiles[0].offsetLeft - rail.scrollLeft) ? i : best,0);
    update(index);
  };
  dots.forEach((dot,i) => dot.onclick = () => go(i));
  section.querySelector('[aria-label="Previous profile"]').onclick = () => go(index-1);
  section.querySelector('[aria-label="Next profile"]').onclick = () => go(index+1);
  for (const type of ['pointerdown','focusin','wheel','pointerenter']) section.addEventListener(type,stop);
  rail.addEventListener('scroll',scroll,{passive:true});
  motion.addEventListener('change',stop);
  cleanup = () => { stop(); motion.removeEventListener('change',stop); };
  update(0);
  if (!motion.matches) timer = setInterval(() => { if (!document.hidden) go(index+1); }, 5500);
}
function showCard(p) {
  page.innerHTML = `<a class="back button card-back" data-profile="${p.id}" href="#home">← Switch profile</a>
  <article class="card" data-profile="${p.id}" style="--tone:${p.tone}">
    ${badgeHeader(p)}<div class="card-body">
    <div class="eyebrow">${escapeHtml(p.label)}</div><h1>Andre Dabit</h1>
    ${p.title ? `<p class="role">${escapeHtml(p.title)}</p>` : ''}
    ${p.description ? `<p class="lead">${escapeHtml(p.description)}</p>` : ''}
    ${contactDetails(p)}
    <div class="actions"><a class="button primary" download="andre-dabit-${p.id}.vcf" href="${escapeHtml(contactUri(p))}">Save Contact</a>
      ${p.website ? `<a class="button" href="${escapeHtml(p.website)}">Website</a>` : ''}
      <button class="button" type="button" data-share="${p.id}">Share card</button>
      <a class="button about-button" href="#about">About Andre</a></div>
    ${socialSection(p, p.id === 'personal' ? 'Social links' : 'Company social links')}
    </div>
  </article>`;
}
function about() {
  page.innerHTML = `<a class="back button about-button" href="#home">← Choose a profile</a><div class="about"><div class="about-intro">
    <div class="eyebrow">Professional profile</div><h1>About Andre Dabit</h1>

      <p>Andre Dabit is an emerging business leader, entrepreneur, and construction professional with a multidisciplinary background spanning construction management, business operations, technology, design, and organisational leadership.</p>
      <p>Driven by a long-term entrepreneurial vision, Andre aspires to establish and lead a <strong>diversified corporation comprising multiple subsidiary companies</strong>, operating across industries including <strong>finance, real estate, law, construction, and property development</strong>, with the ambition to expand into additional sectors as opportunities emerge. His vision is to build an interconnected group of businesses that combine industry expertise, innovation, and strategic leadership under a unified corporate structure, creating a foundation for sustainable growth and long-term success.</p>
      <p>Andre currently holds dual responsibilities at <strong>Draycon Building</strong> as Site Foreman and Systems Administrator, overseeing daily site activities, subcontractor coordination, and company-wide technology systems. His professional journey has progressed from hands-on construction labouring through contract administration and into site supervision, systems management, and business leadership. This diverse experience has provided him with a practical understanding of both operational and commercial aspects of business.</p>
      <p>Andre is currently pursuing a <strong>Bachelor of Construction Management (Honours) at Western Sydney University</strong>, building upon his practical industry experience with formal education in construction, project delivery, and management.</p>
      <p>Beyond his professional pursuits, Andre has demonstrated a longstanding commitment to leadership, service, and community involvement. As a former <strong>Lasallian Captain at Oakhill College</strong>, he played an active role in student leadership, mentoring, and community initiatives. His volunteering experience includes involvement with The Salvation Army, Vinnies, Act for Peace, and Lasallian organisations.</p>
      <p>His contributions have been recognised through the <strong>Bishop of Parramatta Award for Student Excellence</strong> and a <strong>SHAPE Industrial Technology nomination</strong> by the NSW Education Standards Authority, acknowledging his leadership, service, technical creativity, and commitment to excellence.</p>
      <p>With ambitions extending well beyond his current professional experience, Andre is focused on developing the knowledge, relationships, and leadership capabilities necessary to realise his broader corporate vision. Guided by principles of integrity, innovation, strategic thinking, and continuous improvement, he aims to build an enduring business legacy through the development of successful enterprises across multiple industries.</p>
    </div>
    <div class="facts" aria-label="Career totals">
      <div><strong>~4</strong><span>Years working</span></div>
      <div><strong>8</strong><span>Past and current roles</span></div>
      <div><strong>4</strong><span>Licences and certificates</span></div>
      <div><strong>2</strong><span>Awards and recognitions</span></div>
    </div>
    <section class="about-volunteering" aria-labelledby="volunteering-heading">
      <h2 id="volunteering-heading">Volunteering</h2>
      <ul>
        <li><strong>Volunteer</strong><span>Act for Peace · Jun 2024–Jun 2025</span><span>Civil Rights and Social Action</span></li>
        <li><strong>Senior Student – Fundraising Supervisor &amp; Participant</strong><span>The Salvation Army Australia · May 2024–Sep 2025</span><span>Civil Rights and Social Action · Red Shield Appeal fundraising</span></li>
        <li><strong>Encounter Day – Student Leadership Representative</strong><span>Oakhill College · Nov 2024</span><span>Education</span></li>
        <li><strong>Volunteer</strong><span>Vinnies QLD · Jul 2024</span><span>Human Rights</span></li>
        <li><strong>Student Leader Representative</strong><span>Lasallian Volunteers of the De La Salle Christian Brothers · May 2025</span><span>Education</span></li>
      </ul>
    </section>
    <a class="button primary" href="${escapeHtml(linkedIn)}">View full profile on LinkedIn</a>
  </div></div>`;
}
const shareDialog = document.querySelector('#share-dialog');
const shareInput = document.querySelector('#share-url');
const shareStatus = document.querySelector('#share-status');
const shareCanvas = document.querySelector('#share-qr');
const copyShare = document.querySelector('#copy-share');
const downloadQR = document.querySelector('#download-qr');
let shareRoute = 'home';
let shareTarget = '';

function shareUrl(value, route) {
  try {
    const url = new URL(value);
    if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password) return '';
    const host = url.hostname.toLowerCase();
    if (['localhost', '127.0.0.1', '0.0.0.0', '[::1]'].includes(host) || host.endsWith('.localhost')) return '';
    url.hash = route === 'home' ? '' : route;
    return url.href;
  } catch {
    return '';
  }
}

function updateShare() {
  shareTarget = shareUrl(shareInput.value.trim(), shareRoute);
  copyShare.disabled = !shareTarget;
  shareCanvas.hidden = true;
  downloadQR.hidden = true;
  downloadQR.removeAttribute('href');
  shareStatus.textContent = '';
  if (!shareTarget) {
    if (shareInput.value.trim()) shareStatus.textContent = 'Enter a public http or https page address.';
    return;
  }
  try {
    const qr = new ShareQRCode(-1, 0); // Medium error correction.
    qr.addData(shareTarget);
    qr.make();
    const modules = qr.getModuleCount();
    const scale = Math.max(4, Math.ceil(480 / (modules + 8)));
    shareCanvas.width = shareCanvas.height = (modules + 8) * scale;
    const context = shareCanvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, shareCanvas.width, shareCanvas.height);
    context.fillStyle = '#000';
    for (let row = 0; row < modules; row++) {
      for (let col = 0; col < modules; col++) {
        if (qr.isDark(row, col)) context.fillRect((col + 4) * scale, (row + 4) * scale, scale, scale);
      }
    }
    downloadQR.href = shareCanvas.toDataURL('image/png');
    downloadQR.download = `andre-dabit-${shareRoute === 'home' ? 'portfolio' : shareRoute}-qr.png`;
    shareCanvas.hidden = false;
    downloadQR.hidden = false;
  } catch {
    shareStatus.textContent = 'This link could not be turned into a QR code. You can still copy it.';
  }
}

page.addEventListener('click', event => {
  const button = event.target.closest('[data-share]');
  if (!button) return;
  shareRoute = button.dataset.share;
  const profile = profiles.find(p => p.id === shareRoute);
  const hostedLink = shareUrl(location.href, shareRoute);
  document.querySelector('#share-title').textContent = profile ? `Share ${profile.label}` : 'Share portfolio';
  document.querySelector('#share-help').textContent = hostedLink
    ? 'Copy the link or scan the QR code to open this page.'
    : 'Once the portfolio is published, paste its public address here to create a share link and QR code.';
  shareInput.value = hostedLink || shareUrl(shareInput.value, shareRoute);
  updateShare();
  shareDialog.showModal();
});
shareInput.addEventListener('input', updateShare);
shareInput.addEventListener('change', () => {
  if (shareTarget) shareInput.value = shareTarget;
});
copyShare.addEventListener('click', async () => {
  if (!shareTarget) return;
  shareInput.value = shareTarget;
  try {
    await navigator.clipboard.writeText(shareTarget);
    shareStatus.textContent = 'Link copied.';
  } catch {
    shareInput.focus();
    shareInput.select();
    shareStatus.textContent = 'The link is selected. Use your device’s Copy command.';
  }
});
function render(focus = false) {
  cleanup();
  cleanup = () => {};
  const route = location.hash.slice(1);
  const profile = profiles.find(p => p.id === route);
  if (profile) showCard(profile);
  else if (route === 'about') about();
  else home();
  document.title = (profile?.label ?? (route === 'about' ? 'About Andre' : 'Digital Business Cards')) + ' | Andre.Dabit-Portfolio';
  if (focus) { window.scrollTo(0,0); page.focus({preventScroll:true}); }
}
window.addEventListener('hashchange',() => render(true));
render();
</script>
